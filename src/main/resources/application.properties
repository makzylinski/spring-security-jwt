spring.application.name=Jwt-Demo
spring.datasource.url=jdbc:mysql://localhost:3306/jwt_demo?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

# JWT: Base64-encoded secret (min. 256 bits), taken from env variable. Never commit it.
jwt.secret=${JWT_SECRET}
# Token lifetime in milliseconds (1800000 = 30 min)
jwt.expiration-ms=1800000
